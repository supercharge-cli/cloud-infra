name: vectra-cloud
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Vectra Cloud
vendor: Vectra Cloud
homepage: https://github.com/supercharge-cli/cloud-infra
description: Vectra Cloud desktop client
license: UNLICENSED
contents:
  - src: ${PACKAGE_ROOT}/opt/vectra-cloud/
    dst: /opt/vectra-cloud/
  - src: /opt/vectra-cloud/vectra_cloud
    dst: /usr/bin/vectra-cloud
    type: symlink
  - src: ${PACKAGE_ROOT}/usr/share/applications/vectra-cloud.desktop
    dst: /usr/share/applications/vectra-cloud.desktop
  - src: ${PACKAGE_ROOT}/usr/share/icons/hicolor/512x512/apps/vectra-cloud.png
    dst: /usr/share/icons/hicolor/512x512/apps/vectra-cloud.png
overrides:
  deb:
    depends:
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.1-0t64
      - libsecret-1-0
      - libmpv2 | libmpv1
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libsecret
      - mpv-libs
