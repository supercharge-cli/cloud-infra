name: audioplayers_linux
description: No-op Linux implementation of audioplayers (avoids GStreamer).
version: 4.3.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: audioplayers
    platforms:
      linux:
        pluginClass: AudioplayersLinuxPlugin

dependencies:
  flutter:
    sdk: flutter
  audioplayers_platform_interface: ^7.2.0
