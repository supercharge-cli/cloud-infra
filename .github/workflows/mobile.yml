name: mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (for example 1.0.30)"
        required: true
        type: string

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/mobile/pubspec.yaml)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH, for example 1.0.30" >&2
            exit 1
          fi
          # The checked-in Android build number is 30. GitHub's workflow run
          # number increases on each run and is stable when rerunning a run.
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "number=$((30 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; choose a new version." >&2
            exit 1
          fi

  analyze-test:
    name: Analyze & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [analyze-test, version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build apk --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
        working-directory: apps/mobile
      - run: cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk vectra-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-android-apk
          path: vectra-android.apk
          if-no-files-found: error

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    needs: [analyze-test, version]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libasound2-dev libmpv-dev libepoxy-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
        working-directory: apps/mobile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1
          curl -fsSL -o /tmp/appimagetool 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          curl -fsSL -o /tmp/appimage-runtime 'https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64'
          chmod +x /tmp/appimagetool
          echo /tmp >> "$GITHUB_PATH"
      - run: python3 apps/mobile/linux/packaging/test_package_layout.py
      - run: apps/mobile/linux/packaging/package.sh
        env:
          VERSION: ${{ needs.version.outputs.name }}
          APPIMAGE_RUNTIME: /tmp/appimage-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-linux-x64
          path: |
            linux-packages/vectra-linux-x64.tar.gz
            linux-packages/vectra-linux-x86_64.AppImage
            linux-packages/vectra-linux-amd64.deb
            linux-packages/vectra-linux-x86_64.rpm
            linux-packages/vectra-cloud-aur-recipe.tar.gz
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: [analyze-test, version]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
        working-directory: apps/mobile
      - run: Compress-Archive -Path apps/mobile/build/windows/x64/runner/Release/* -DestinationPath vectra-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-windows-x64
          path: vectra-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS desktop
    runs-on: macos-latest
    needs: [analyze-test, version]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
        working-directory: apps/mobile
      - run: |
          set -euo pipefail
          apps=(apps/mobile/build/macos/Build/Products/Release/*.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" vectra-macos.zip
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-macos
          path: vectra-macos.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [version, android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --target "$TARGET_SHA" --title "Vectra $VERSION" \
            --notes "Build $BUILD_NUMBER. Android is debug-signed; desktop builds are not release-signed or notarized." \
            artifacts/vectra-android.apk artifacts/vectra-linux-x64.tar.gz \
            artifacts/vectra-linux-x86_64.AppImage artifacts/vectra-linux-amd64.deb \
            artifacts/vectra-linux-x86_64.rpm artifacts/vectra-cloud-aur-recipe.tar.gz \
            artifacts/vectra-windows-x64.zip artifacts/vectra-macos.zip
