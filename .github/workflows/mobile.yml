name: mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.4"

jobs:
  analyze-test:
    name: Analyze & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build apk --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build linux --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-linux-x64
          path: apps/mobile/build/linux/x64/release/bundle/

  windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build windows --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-windows-x64
          path: apps/mobile/build/windows/x64/runner/Release/

  macos:
    name: macOS desktop
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build macos --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: vectra-macos
          path: apps/mobile/build/macos/Build/Products/Release/*.app
